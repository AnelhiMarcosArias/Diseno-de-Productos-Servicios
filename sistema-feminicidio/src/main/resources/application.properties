spring.application.name=sistema-feminicidio

# Configuración local: crear sistema-feminicidio/.env a partir de .env.example.
# El archivo .env se importa solo si existe y nunca debe versionarse.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_feminicidio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Desarrollo: Hibernate crea/actualiza las tablas a partir de las entidades JPA.
# Para producción, reemplazar por migraciones Flyway versionadas.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}
